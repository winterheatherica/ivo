# The local M1 environment. Run from the repo root:
#   docker compose -f deploy/compose/compose.yaml up --build -d
# Valkey, RabbitMQ, MinIO, and Vault arrive with the milestones that use them.
name: ivo

x-go-service: &go-service
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ivo
      POSTGRES_PASSWORD: ivo
      POSTGRES_DB: ivo
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ivo -d ivo"]
      interval: 3s
      timeout: 3s
      retries: 30

  mongodb:
    image: mongo:8.0
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    ports: ["27017:27017"]
    volumes: [mongodata:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka:
    image: apache/kafka:4.4.0
    environment:
      # One KRaft node that is both broker and controller, so there is no ZooKeeper.
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics come from kafka-init
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
      CLUSTER_ID: kZu_zl-9RleF_yil8ZlIHQ
    ports: ["19092:19092"]
    volumes: [kafkadata:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 20s
      retries: 20
      start_period: 60s
      start_interval: 3s

  # Creates the topics listed in docs/detail/README.md#events, then exits.
  # Every kafka-topics.sh call starts a JVM, so topics that already exist are skipped.
  kafka-init:
    image: apache/kafka:4.4.0
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        topics=/opt/kafka/bin/kafka-topics.sh
        existing="$$($$topics --bootstrap-server kafka:9092 --list)"
        create() {
          grep -qx "$$1" <<< "$$existing" && return 0
          $$topics --bootstrap-server kafka:9092 --create --topic "$$1" \
            --partitions "$$2" --replication-factor 1 --config retention.ms="$$3"
        }
        for t in post.submitted post.published image.completed image.failed \
                 image.review.requested engagement.recorded usage.recorded; do
          create "$$t" 3 604800000
          create "$$t.dlq" 1 1209600000
        done
        create netizen.comment.requested 12 604800000
        create netizen.comment.requested.dlq 1 1209600000
        $$topics --bootstrap-server kafka:9092 --list
    restart: "no"

  game:
    <<: *go-service
    build:
      context: ../..
      dockerfile: deploy/docker/go-service.Dockerfile
      args: {SERVICE: game}
    environment:
      DATABASE_URL: postgres://ivo:ivo@postgres:5432/ivo?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      GRPC_ADDR: ":9090"
      AUTO_PROVISION: "true"   # dev: the player and idol are created on the first post
      DEV_SEASON: "true"
      RENDER_ESTIMATE: 1m
      DAILY_POST_LIMIT: "20"
      FOLD_INTERVAL: 30s
    ports: ["9091:9090"]
    depends_on:
      postgres: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}

  imaging:
    <<: *go-service
    build:
      context: ../..
      dockerfile: deploy/docker/go-service.Dockerfile
      args: {SERVICE: imaging}
    environment:
      DATABASE_URL: postgres://ivo:ivo@postgres:5432/ivo?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      BATCH_SIZE: "20"
      BATCH_INTERVAL: 15s      # production: 1 hour
      POLL_INTERVAL: 2s
    depends_on:
      postgres: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}

  netizen:
    <<: *go-service
    build:
      context: ../..
      dockerfile: deploy/docker/go-service.Dockerfile
      args: {SERVICE: netizen}
    environment:
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB: netizen
      KAFKA_BROKERS: kafka:9092
      GAME_ADDR: game:9090
      GRPC_ADDR: ":9090"
      DELAY_SCALE_BP: "100"    # dev: reactions 100 times faster (4 hours become 2.4 minutes)
    ports: ["9092:9090"]
    depends_on:
      mongodb: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      game: {condition: service_started}

  gateway:
    <<: *go-service
    build:
      context: ../..
      dockerfile: deploy/docker/go-service.Dockerfile
      args: {SERVICE: gateway}
    environment:
      HTTP_ADDR: ":8080"
      GAME_ADDR: game:9090
      NETIZEN_ADDR: netizen:9090
      AUTH_MODE: dev           # M3 replaces this with JWTs from the auth server
    ports: ["8080:8080"]
    depends_on:
      game: {condition: service_started}
      netizen: {condition: service_started}

volumes:
  pgdata:
  mongodata:
  kafkadata:
